<!doctype html>
<html lang="tr">
  <body style="margin:0;background:#f1f5f4;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0f172a">
    <div style="max-width:520px;margin:0 auto;padding:24px">
      <div style="background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(15,23,42,.06)">
        <div style="background:#059669;padding:20px 24px">
          <span style="color:#ffffff;font-size:18px;font-weight:700">SahaSepeti</span>
        </div>
        <div style="padding:24px">
          <h1 style="margin:0 0 8px;font-size:18px">E-posta değişikliğini onaylayın</h1>
          <p style="margin:0 0 20px;color:#475569;font-size:14px">
            Hesabınızın e-posta adresini <strong>{{ .NewEmail }}</strong> olarak güncellemek için
            aşağıdaki butona tıklayın.
          </p>
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#059669;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:12px">Değişikliği Onayla</a>
          <p style="margin:24px 0 0;color:#94a3b8;font-size:12px">
            Bu değişikliği siz talep etmediyseniz lütfen bu e-postayı yok sayın.
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
