<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/sahasepeti-favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SahaSepeti — Türkiye'nin spor tesisi rezervasyon platformu. Halı saha, basketbol, tenis ve daha fazlası için online rezervasyon."
    />
    <meta name="theme-color" content="#064e3b" />
    <title>SahaSepeti — Spor Tesisi Rezervasyonu</title>

    <!-- Varsayılan sosyal paylaşım etiketleri (sayfa bazında Seo bileşeni override eder) -->
    <meta property="og:site_name" content="SahaSepeti" />
    <meta property="og:title" content="SahaSepeti — Spor Tesisi Rezervasyonu" />
    <meta
      property="og:description"
      content="Türkiye'nin spor tesisi rezervasyon platformu. Müsait saatleri gör, online rezervasyon yap."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- Tema, React yüklenmeden önce uygulanır (flash önlenir). Varsayılan: dark -->
    <script>
      try {
        var t = localStorage.getItem('sahasepeti-theme')
        if (t !== 'light') document.documentElement.classList.add('dark')
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
